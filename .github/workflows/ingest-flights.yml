name: ingest-flights

on:
  schedule:
    - cron: "15 * * * *"        # hourly, 15 past
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Days to backfill (blank = current window only)"
        required: false
        default: ""

jobs:
  extract:
    runs-on: ubuntu-latest
    env:
      OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
      OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
      OUTPUT_MODE: s3
      S3_BUCKET: ${{ secrets.MP_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-west-2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install boto3
        run: pip install boto3

      - name: Extract arrivals to S3
        run: |
          if [ -n "${{ inputs.backfill_days }}" ]; then
            python3 extract_flights.py --backfill ${{ inputs.backfill_days }}
          else
            python3 extract_flights.py
          fi
